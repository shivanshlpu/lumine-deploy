name: Myco PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'myco/setup-review-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Run Myco review
        uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          api_key: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY || secrets.MYCO_LLM_KEY || secrets.MYCO_LLM_API_KEY }}
