name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Review Access
        id: review_auth
        uses: MycoIntelligence/myco-bundled-action/auth@v1
        with:
          control_plane_url: ${{ vars.CONTROL_PLANE_URL || vars.MYCO_CONTROL_PLANE_URL || 'https://myco-deploy.onrender.com' }}
          oidc_audience: ${{ vars.OIDC_AUDIENCE || vars.MYCO_OIDC_AUDIENCE || 'https://myco.intelligence' }}

      - name: Automated AI Code Review
        uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          api_key: ${{ secrets.LLM_API_KEY || secrets.MYCO_LLM_KEY || secrets.OPENAI_API_KEY }}
          llm_provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          follow_intent_links: ${{ vars.FOLLOW_INTENT_LINKS || 'false' }}
          create_tickets: ${{ vars.CREATE_TICKETS || 'false' }}
          metrics_endpoint: ${{ vars.CONTROL_PLANE_URL || vars.MYCO_CONTROL_PLANE_URL || 'https://myco-deploy.onrender.com' }}/api/ingest-metrics
          metrics_api_key: ${{ steps.review_auth.outputs.grant }}
          client_id: ${{ steps.review_auth.outputs.client_id }}
