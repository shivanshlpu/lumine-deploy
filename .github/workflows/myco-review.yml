name: "MyCo AI Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  myco-review:
    name: "MyCo SDET Review"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Target Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "Run MyCo AI Code Review"
        uses: MycoIntelligence/myco-bundled-action@v1-groq
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          api_key: ${{ secrets.LLM_API_KEY || secrets.MYCO_LLM_KEY }}
          llm_provider: "groq"
          metrics_endpoint: "https://myco-deploy.onrender.com/api/ingest-metrics"
          metrics_api_key: "myco-metrics-key"
          client_id: "war"
