name: Myco PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'myco/setup-review-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Request Myco review access
        id: myco_access
        uses: MycoIntelligence/myco-bundled-action/auth@fa557ec81ded18bd54b65578ffdece8be2425856
      - name: Run Myco review
        uses: MycoIntelligence/myco-bundled-action@fa557ec81ded18bd54b65578ffdece8be2425856
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          api_key: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY || secrets.MYCO_LLM_KEY || secrets.MYCO_LLM_API_KEY }}
          metrics_api_key: ${{ steps.myco_access.outputs.grant }}
          client_id: ${{ steps.myco_access.outputs.client_id }}
